services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    network_mode: host
    environment:
      - NAPCAT_UID=501
      - NAPCAT_GID=20
      - ACCOUNT=你的QQ号
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
      - ./shared_media:/openclaw_media
